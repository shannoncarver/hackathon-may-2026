[project]
name = "linq-hackathon-may-2026"
version = "0.0.1"
description = "LINQ Hackathon May 2026 — internal AI workflow system"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.52.0",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "inspect-ai>=0.3.50",
]

[tool.setuptools]
# This project is a config tree, not a Python package — `pip install -e .` is
# only used to install the declared dependencies for tests. Telling setuptools
# there are zero modules to install disables flat-layout auto-discovery, which
# would otherwise fail on top-level dirs like evals/, schemas/, knowledge/.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
