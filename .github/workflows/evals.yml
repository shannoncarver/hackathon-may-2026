name: Evals and tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: pytest (schema + structural)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v

  evals:
    name: per-agent evals (run.py --ci)
    runs-on: ubuntu-latest
    needs: tests
    # Only run when the ANTHROPIC_API_KEY secret is configured. Forks and
    # secret-less PRs skip this job rather than failing on missing creds.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check for API key
        id: check_key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY not set; skipping evals/run.py. Add it as a repo secret to enable."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run evals
        if: steps.check_key.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python evals/run.py --ci

      - name: Upload eval reports
        if: steps.check_key.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
          if-no-files-found: ignore
          retention-days: 30
