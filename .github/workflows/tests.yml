name: Tests

# Hackathon scope: CI runs schema/structural tests only.
# The eval harness (evals/run.py) remains in-repo as a manual tool —
# run locally with `python evals/run.py [--agent <name>] [--ci]`.
# CI gating on evals is deferred to a follow-up; see ADR-0011 for details.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: pytest (schema + structural)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v
